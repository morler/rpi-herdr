[package]
name = "rpi-herdr"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Reports rpi agent state, session resume command and pane release to Herdr."
readme = "README.md"
# Provenance for registries and downstream consumers (`cargo publish` warns
# without it). The plugin is distributed as a prebuilt cdylib, so the crate is
# the single source of truth for that binary.
repository = "https://github.com/morler/rpi-herdr"
homepage = "https://github.com/morler/rpi-herdr"
documentation = "https://docs.rs/rpi-herdr"
keywords = ["rpi", "herdr", "extension", "agent"]
categories = ["development-tools"]
# Ship only what the cdylib needs; the design notes stay out of the crate.
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
# cdylib for the host loader; rlib so `cargo test` can link the modules.
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
# Keep symbol names: the artifact is loaded into the host process, and a panic or
# crash inside the plugin is otherwise impossible to read. This still drops the
# DWARF payload that `strip = "symbols"` was really after.
strip = "debuginfo"
